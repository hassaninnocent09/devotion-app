name: devotion_app
description: A calm daily devotional and Bible reading app.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  # Variable fonts. Overwrite either file (same name) to use your own.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 600
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
          weight: 400
        - asset: assets/fonts/Lora.ttf
          weight: 500
        - asset: assets/fonts/Lora.ttf
          weight: 600
